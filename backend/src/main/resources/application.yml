spring:
  application:
    name: visor-pacs-backend
  config:
    import:
      # Permite correr desde el IDE leyendo el .env de la raíz del repo (en Docker no existe y se ignora)
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:visor_pacs}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Cada solicitud usa una sola conexión; 20 alcanzan para decenas de inicios de sesión simultáneos (D-19).
      maximum-pool-size: ${DB_POOL_MAX:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # el esquema lo controla Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  # RF-09: correo saliente. Los tiempos de espera evitan que un SMTP lento retenga hilos (el envío ya es asíncrono).
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: 8080
  # Detrás de Caddy (HTTPS): toma la IP real del cliente de X-Forwarded-For (solo si el proxy es de la red interna).
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

management:
  health:
    mail:
      enabled: false   # un SMTP caído no debe poner el servicio en DOWN
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Documentación OpenAPI: /swagger-ui.html y /v3/api-docs. En producción se puede apagar con OPENAPI_ENABLED=false.
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: alpha

app:
  sesion:
    # Segundos que se recuerda el estado de una cuenta antes de releerlo de la base (los cambios hechos
    # desde esta aplicación invalidan la memoria al instante; esto solo cubre cambios por otra vía).
    cache-cuenta-segundos: ${SESION_CACHE_SEGUNDOS:30}
    # Tope absoluto: aunque renueve el token mientras trabaja, tras estas horas debe escribir su clave otra vez.
    duracion-maxima-horas: ${SESION_DURACION_MAXIMA_HORAS:8}
  limite-login:
    # Solicitudes de inicio de sesión por IP dentro de la ventana (0 = sin límite). Responde 429.
    max-solicitudes: ${LIMITE_LOGIN_MAX:30}
    ventana-segundos: ${LIMITE_LOGIN_VENTANA_SEGUNDOS:60}
  recuperacion:
    # RF-09. Apagado por defecto: los endpoints responden 404 y el login no muestra el enlace.
    habilitada: ${RECUPERACION_HABILITADA:false}
    vigencia-minutos: ${RECUPERACION_VIGENCIA_MINUTOS:15}
    max-por-cuenta-hora: ${RECUPERACION_MAX_CUENTA_HORA:3}
    max-por-ip: ${RECUPERACION_MAX_IP:10}
    ventana-ip-segundos: ${RECUPERACION_VENTANA_IP_SEGUNDOS:3600}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    remitente: ${SMTP_REMITENTE:no-reply@localhost}
  auditoria:
    # La apertura de un estudio se registra una vez por usuario y estudio dentro de esta ventana.
    apertura-ventana-minutos: ${AUDITORIA_VENTANA_MINUTOS:15}
  jwt:
    secret: ${JWT_SECRET}
    issuer: visor-pacs
    ttl-minutes: ${JWT_TTL_MINUTES:15}
  security:
    max-failed-attempts: ${MAX_FAILED_ATTEMPTS:5}
    lock-minutes: ${LOCK_MINUTES:15}
  orthanc:
    base-url: ${ORTHANC_URL:http://localhost:8042}
    username: ${ORTHANC_USER}
    password: ${ORTHANC_PASSWORD}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    username: ${BOOTSTRAP_USERNAME:}
    password: ${BOOTSTRAP_PASSWORD:}
    nombres: Médico
    apellidos: de Prueba
    email: medico.prueba@example.com
    paciente-username: ${BOOTSTRAP_PACIENTE_USERNAME:}
    paciente-password: ${BOOTSTRAP_PACIENTE_PASSWORD:}
    paciente-dicom-id: ${BOOTSTRAP_PACIENTE_DICOM_ID:PRUEBA-0001}
    paciente-nombres: Paciente
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
